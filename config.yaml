# Paper Radar configuration.
# Validated by src/radar/config.py; run `uv run radar check-config` after editing.

categories:
  - cs.CV
  - cs.LG
  - cs.AI

# Seed papers that define the interest profile, by arXiv ID without version.
# Starter list from the overview; extend to 8-15 papers across your interests.
seed_papers:
  - id: "2304.07193"
    note: DINOv2
  - id: "2304.02643"
    note: Segment Anything (SAM)
  - id: "2007.04612"
    note: Concept Bottleneck Models

# Keywords for the BM25 baseline and the re-ranker's keyword feature. Aim for 10-20.
keywords:
  - self-supervised learning
  - vision transformer
  - segmentation
  - foundation model
  - concept bottleneck
  - interpretability

ranking:
  list_size: 10          # papers in the weekly "This week" top list
  exploration_count: 3   # lower-ranked papers mixed in for unbiased feedback
  exploration_rank_range: [20, 100]
  min_ratings_for_reranker: 50

ingest:
  request_delay_seconds: 3.0   # arXiv's minimum between requests
  page_size: 200
  max_retries: 5
  retry_backoff_seconds: 5.0   # doubles after each failed attempt
  rate_limit_backoff_seconds: 60.0  # HTTP 429: start higher (60, 120, 240, 480, 600 s)
  max_backoff_seconds: 600.0
  initial_lookback_days: 7     # first run, when no watermark exists yet
  overlap_days: 7              # re-fetch before the watermark to catch late announcements
  chunk_days: 7                # long gaps are fetched in windows of this size
