[project]
name = "arxiv-radar"
version = "0.1.0"
description = "arXiv recommender: weekly ingestion, embedding-based ranking, label-trained re-ranker and a public dashboard."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=2.0.1",
    "feedparser>=6.0.14",
    "pyarrow>=26.0.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "requests>=2.34.2",
    "typer>=0.12",
]

[project.scripts]
radar = "radar.cli:app"

[dependency-groups]
dev = [
    "pre-commit>=3.7",
    "pytest>=8.2",
    "responses>=0.26.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI options as call defaults by design.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
